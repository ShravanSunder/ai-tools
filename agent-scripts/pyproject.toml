[project]
name = "agent-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "typesafe-sdk>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["stop-review/tests"]
python_files = ["test_*.py"]
