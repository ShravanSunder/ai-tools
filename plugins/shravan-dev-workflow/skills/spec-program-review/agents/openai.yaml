interface:
  display_name: "Spec and Program Review"
  short_description: "Classify or review Why, What, and structural How"
  default_prompt: "Use spec-program-review to classify whether a specification-only or program-only change semantically requires independent review, or to independently review a specification, program design, or pair for correctness, scope fidelity, reader understanding, current/proposed call paths, and planning readiness without editing or accepting them. Route one named skill package to skills-creation and standalone security audits or threat models to ops-security-review."
