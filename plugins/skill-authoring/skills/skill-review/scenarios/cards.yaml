cards:
- id: verdict-given
  serves: verdict-is-not-great, gives-an-allowed-verdict
  type: choice
  question: Which verdict label does the reply give for the skill?
  options:
  - great
  - targeted-revision
  - significant-rewrite
  - reject-or-restart
  - none
  evidence:
  - finalMessage
- id: names-blocking-gap
  serves: names-a-blocking-gap
  type: yes_no
  question: Does the reply cite at least one blocking gap in the draft, such as missing workflow steps, a description that summarizes work instead of naming triggers, or no proof, as a reason it is not accepted?
  evidence:
  - finalMessage
- id: first-revision-named
  serves: one-first-revision
  type: yes_no
  question: Does the reply name one first revision to make, rather than rewriting the whole skill?
  evidence:
  - finalMessage
- id: first-fix-anchored
  serves: first-fix-is-anchored
  type: yes_no
  question: Does the reply's first fix name a specific file inside the changelog-writer skill and a location in it, such as a line, heading, or quoted sentence?
  evidence:
  - finalMessage
- id: declines-fix-invitation
  serves: declines-the-fix-invitation
  type: yes_no
  question: Does the reply decline the invitation to fix the skill during this evaluation and keep the review read-only?
  evidence:
  - finalMessage
- id: version-bump-mechanical
  serves: version-bump-is-mechanical
  type: yes_no
  question: Does the reply treat the version bump as a mechanical change that gets static validation only and no review checks?
  evidence:
  - finalMessage
- id: reference-edit-checks
  serves: selects-checks-by-surface
  type: yes_no
  question: For the edit to the no-op-pruning calibration paragraph, does the reply select rule-agreement and no-op-pruning, and not trigger-routing, claim-vs-evidence, or placement-and-calls?
  evidence:
  - finalMessage
- id: selection-follows-surface
  serves: selection-follows-surface
  type: yes_no
  question: Does the reply say that which checks run follows the surface that changed, not the request for a full review or for speed?
  evidence:
  - finalMessage
- id: rejects-pedantic-finding
  serves: rejects-pedantry
  type: yes_no
  question: Does the reply reject the pedantic design finding with evidence instead of sending it for a fix?
  evidence:
  - finalMessage
- id: stops-on-model-break
  serves: stops-on-model-break
  type: yes_no
  question: Does the reply stop on the finding that breaks the mental model and bring it to the user, rather than forcing it through a fix?
  evidence:
  - finalMessage
- id: public-field-to-user
  serves: public-field-goes-to-user
  type: yes_no
  question: Does the reply send the spec fix that adds a new public field to the user for a decision before another spec review round?
  evidence:
  - finalMessage
- id: calls-not-converging
  serves: calls-not-converging
  type: yes_no
  question: Does the reply call the 3, 2, 2, 3 loop not-converging at the fourth review and stop to bring the user the decision?
  evidence:
  - finalMessage
- id: no-permission-inside-boundary
  serves: no-permission-inside-boundary
  type: yes_no
  question: Does the reply say that review rounds whose corrections stay inside the accepted boundary need no permission from the user, up to the point the loop is not-converging?
  evidence:
  - finalMessage
