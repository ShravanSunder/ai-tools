cards:
- id: label-swap-needs-review
  serves: label-swap-is-an-edit
  type: yes_no
  question: Does the reply treat switching the accepted spec's priority labels as an edit that needs review before work continues under it, rather than as too small to matter?
  evidence:
  - finalMessage
- id: no-run-under-stale-acceptance
  serves: no-run-a-under-old-acceptance
  type: yes_no
  question: Does the reply avoid implementing Run A under the old acceptance after editing the spec, either by sending the edit back through spec review first or by doing Run A under the unedited spec with the label change deferred?
  evidence:
  - finalMessage
- id: review-before-pr-ready
  serves: review-before-pr-ready
  type: yes_no
  question: Does the reply say this behavior-changing update needs an independent implementation review before it is PR-ready, even after the pressure scenario passes?
  evidence:
  - finalMessage
- id: routes-to-skill-review
  serves: routes-to-skill-review
  type: yes_no
  question: Does the reply route the implementation review to the skill-review skill's implementation stage rather than describing its own improvised review?
  evidence:
  - finalMessage
- id: proof-and-assessment-first
  serves: proof-and-assessment-first
  type: yes_no
  question: Does the reply put proof and an assessment of the actual diff before the independent review?
  evidence:
  - finalMessage
- id: proof-before-review
  serves: proof-before-review
  type: yes_no
  question: Does the reply require the pressure scenarios to run before the independent implementation review, rejecting review now and proof later?
  evidence:
  - finalMessage
- id: assessment-before-review
  serves: assessment-before-review
  type: yes_no
  question: Does the reply require an assessment of the current diff and proof against the need and the accepted spec before the independent review starts?
  evidence:
  - finalMessage
- id: corrections-fresh-proof
  serves: corrections-get-fresh-proof
  type: yes_no
  question: Does the reply say accepted corrections return to the implementer for fresh proof and a fresh assessment before the review refreshes its coverage?
  evidence:
  - finalMessage
