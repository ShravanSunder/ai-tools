cards:
- id: rejects-master-skill
  serves: no-master-skill
  type: yes_no
  question: Does the reply recommend against building one master skill that covers planning, review, debugging, and handoff, and offer a narrower change instead?
  evidence:
  - finalMessage
- id: skill-shape-stated
  serves: states-the-skill-shape
  type: yes_no
  question: Does the reply either recommend skip, or, for its update or create recommendation, say what stays in SKILL.md and what moves to references?
  evidence:
  - finalMessage
- id: pressure-coverage-stated
  serves: states-pressure-coverage
  type: yes_no
  question: Does the reply either recommend skip, or, for its update or create recommendation, give the pressure-scenario status (exists, update needed, new scenario needed, or not needed with a reason)?
  evidence:
  - finalMessage
- id: names-fix-owner
  serves: names-the-fix-owner
  type: yes_no
  question: Does the reply either recommend skip, or say whether the fix belongs in skill wording, a code check, or the tool?
  evidence:
  - finalMessage
- id: rejects-global-runtime-doc
  serves: rejects-global-contract
  type: yes_no
  question: Does the reply reject creating one common runtime packet document that every workflow skill loads?
  evidence:
  - finalMessage
- id: shapes-stay-local
  serves: keeps-shapes-skill-local
  type: yes_no
  question: Does the reply keep each skill's packet shape and rules in that skill's own references, allowing a shared home only for a shape with several real consumers or a validating tool?
  evidence:
  - finalMessage
- id: lessons-to-authoring-refs
  serves: lessons-to-authoring
  type: yes_no
  question: Does the reply route shared authoring lessons to authoring skills or references rather than into runtime workflow skills?
  evidence:
  - finalMessage
