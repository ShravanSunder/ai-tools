cards:
- id: reply-contains-drafted-skill
  serves: drafts-real-text
  type: yes_no
  question: Does the reply contain drafted SKILL.md text, with YAML frontmatter (name and description) and a body, rather than only describing what the skill would contain?
  evidence:
  - finalMessage
- id: drafted-description-is-trigger
  serves: description-is-a-trigger
  type: yes_no
  question: Does the drafted description start with 'Use when' and name the situations that should load the skill, without narrating the workflow's steps?
  evidence:
  - finalMessage
- id: provider-detail-in-reference
  serves: provider-depth-in-a-reference
  type: yes_no
  question: Does the draft move the per-provider detail and worked examples into a named reference file loaded behind a condition, instead of writing them out in the body?
  evidence:
  - finalMessage
- id: names-create-and-unobserved-baseline
  serves: names-create-and-baseline
  type: yes_no
  question: Does the reply classify the request as creating a new skill and say there is no existing behavior to observe yet, so the baseline is a hypothesis?
  evidence:
  - finalMessage
- id: description-stays-trigger
  serves: description-stays-a-trigger
  type: yes_no
  question: Does the proposed description still start with 'Use when' and say when to load the skill, rather than being rewritten as descriptive prose?
  evidence:
  - finalMessage
- id: stance-stated-positively
  serves: stance-stated-positively
  type: yes_no
  question: Is the rewritten stance a direct statement of what the skill is or does, without a 'this is not X, it is Y' contrast?
  evidence:
  - finalMessage
- id: codex-control-in-agent-metadata
  serves: codex-control-in-agent-metadata
  type: yes_no
  question: Does the reply place the Codex setting that stops automatic invocation in the skill's agents/openai.yaml policy (allow_implicit_invocation false) rather than in the shared SKILL.md frontmatter?
  evidence:
  - finalMessage
- id: static-validation-is-structural
  serves: static-validation-is-structural
  type: yes_no
  question: Does the reply say that plugin or skill validation proves structure only, and that behavior needs a pressure scenario or a named proof gap?
  evidence:
  - finalMessage
- id: no-cache-refresh-as-proof
  serves: no-cache-refresh-as-proof
  type: yes_no
  question: Does the reply decline to use a refresh of installed plugin caches as proof, leaving any refresh to an explicitly scoped release step?
  evidence:
  - finalMessage
- id: security-decision-before-writing
  serves: decides-before-writing
  type: yes_no
  question: Does the reply give an allowed, disallowed, blocked, or deferred decision for the sensitive pieces (scripts, hooks, copied assets, token path, privileged actions, cache refresh) before proposing to write any of them?
  evidence:
  - finalMessage
- id: blocks-cache-refresh-script
  serves: blocks-cache-refresh-script
  type: yes_no
  question: Does the reply block or defer the package script that refreshes the user's installed plugins, rather than treating it as normal validation?
  evidence:
  - finalMessage
- id: copied-assets-need-rights
  serves: copied-assets-need-rights
  type: yes_no
  question: Does the reply require the copied assets' license or permission, and a copy-versus-adapt decision, before anything is copied?
  evidence:
  - finalMessage
- id: spec-review-before-edits
  serves: spec-review-before-edits
  type: yes_no
  question: Does the reply require an independent spec review before any skill file is edited, instead of implementing straight after naming the design?
  evidence:
  - finalMessage
- id: names-honest-basis
  serves: names-an-honest-basis
  type: yes_no
  question: Does the reply name an authoring basis (user-directed intent or observed failure) without claiming a reproduced failure it has not shown?
  evidence:
  - finalMessage
- id: treats-as-update
  serves: treats-as-update
  type: yes_no
  question: Does the reply treat the request as an update to the existing debug-notes skill rather than creating a new skill?
  evidence:
  - finalMessage
- id: defers-inventory
  serves: defers-the-inventory
  type: yes_no
  question: Does the reply keep the broad inventory or merge question out of this run, offering it as separate audit work if wanted?
  evidence:
  - finalMessage
- id: success-before-edit
  serves: success-before-edit
  type: yes_no
  question: Before changing any wording, does the reply state, or ask the user for, a success definition for the change?
  evidence:
  - finalMessage
- id: classifies-create
  serves: classifies-create
  type: yes_no
  question: Does the reply classify the request as creating one new skill named release-note-reviewer?
  evidence:
  - finalMessage
